# Netlify configuration.
# This is a plain static site — nothing to compile — so there is no build
# command. "publish = ." tells Netlify the site lives at the repo root,
# where index.html already sits.

[build]
  publish = "."
  command = ""

# Long cache on images (their filenames change when the photo changes),
# but never cache the HTML, so edits show up immediately.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
